<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KonkosYuk - Offline</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Ubuntu,
          Cantarell,
          Noto Sans,
          Helvetica,
          Arial,
          sans-serif;
        background: #ffffff;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        padding: 24px;
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #475569;
        margin: 0 0 24px;
      }
      button {
        border: none;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 16px;
        background: #0f172a;
        color: #ffffff;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f8fafc;
        }
        p {
          color: #94a3b8;
        }
        button {
          background: #f8fafc;
          color: #0f172a;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/icons/icon-192.png" alt="KonkosYuk" class="logo" />
      <h1>Anda sedang offline</h1>
      <p>Periksa koneksi internet Anda dan coba lagi.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
