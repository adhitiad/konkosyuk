services:
  - type: background
    name: notification-service
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    branch: main
    rootDir: apps/notifications
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NOTIFICATION_ENCRYPTION_KEY
        sync: false
      - key: GRPC_PORT
        value: "50052"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: WHATSAPP_SESSION_PATH
        value: "./whatsapp-session"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:admin@konkosyuk.app"
      - key: NOTIFICATION_SERVICE_SECRET
        sync: false
