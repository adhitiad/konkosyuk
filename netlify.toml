[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js plugin for Netlify
[plugins]
  # Official Next.js plugin is included by default in Netlify's Next.js runtime
  # No additional plugin configuration needed for Next.js 16

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    X-DNS-Prefetch-Control = "on"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# API routes - stricter CSP
[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Static assets - cache control
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Functions configuration (if using Netlify Functions)
[functions]
  included_files = ["src/db/schema.ts"]
  node_bundler = "esbuild"

# Redirects for SPA routing
# Next.js handles client-side routing automatically, but uncomment if needed
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
#   force = true

# Environment variables (set these in Netlify UI instead for security)
# These are just placeholders - actual values should be set in Netlify dashboard
# [context.production.environment]
#   DATABASE_URL = "postgresql://..."
#   REDIS_URL = "redis://..."
#   BETTER_AUTH_SECRET = "..."

# Branch-specific settings
[context.branch-deploy]
  command = "bun run build"
  environment = { NODE_ENV = "development" }

[context.deploy-preview]
  command = "bun run build"
  environment = { NODE_ENV = "development" }
