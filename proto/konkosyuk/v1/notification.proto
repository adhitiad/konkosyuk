syntax = "proto3";

package konkosyuk.v1;

import "konkosyuk/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.konkosyuk.api.v1";

option go_package = "notif/proto/konkosyuk/v1";

enum NotificationCategory {
  NOTIFICATION_CATEGORY_UNSPECIFIED = 0;
  BOOKING = 1;
  PAYMENT = 2;
  MAINTENANCE = 3;
  INSPECTION = 4;
  CHAT = 5;
  REVIEW = 6;
  SYSTEM = 7;
}

enum NotificationPriority {
  NOTIFICATION_PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  NORMAL = 2;
  HIGH = 3;
  URGENT = 4;
}

enum EmailDigest {
  EMAIL_DIGEST_UNSPECIFIED = 0;
  IMMEDIATE = 1;
  DAILY = 2;
  WEEKLY = 3;
  NEVER = 4;
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  IN_APP = 1;
  EMAIL = 2;
  PUSH = 3;
}

message ChannelPreferences {
  bool in_app = 1;
  bool email = 2;
  bool push = 3;
}

message UserPreferences {
  map<string, ChannelPreferences> preferences = 1;
  EmailDigest email_digest = 2;
  string quiet_hours_start = 3;
  string quiet_hours_end = 4;
  string timezone = 5;
}

message NotificationEvent {
  string user_id = 1;
  string type = 2;
  NotificationCategory category = 3;
  NotificationPriority priority = 4;
  string title = 5;
  string message = 6;
  string action_url = 7;
  string action_label = 8;
  string reference_id = 9;
  string reference_type = 10;
  map<string, string> metadata = 11;
}

message DispatchResponse {
  bool success = 1;
  map<string, bool> channel_results = 2;
  string error = 3;
}

message DispatchBatchRequest {
  repeated NotificationEvent events = 1;
}

message DispatchBatchResponse {
  repeated DispatchResponse results = 1;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string message = 4;
  string type = 5;
  string reference_id = 6;
  bool is_read = 7;
  string created_at = 8;
}

message PushSubscription {
  string id = 1;
  string user_id = 2;
  string endpoint = 3;
  string p256dh = 4;
  string auth = 5;
  string created_at = 6;
}

message NotificationSettings {
  string id = 1;
  string resend_api_key = 2;
  string resend_from_email = 3;
  string meta_access_token = 4;
  string meta_phone_number_id = 5;
  string meta_maintenance_created_template = 6;
  string meta_maintenance_updated_template = 7;
  string created_at = 8;
  string updated_at = 9;
}

message UserNotificationPreferences {
  string id = 1;
  string user_id = 2;
  map<string, ChannelPreferences> preferences = 3;
  EmailDigest email_digest = 4;
  string quiet_hours_start = 5;
  string quiet_hours_end = 6;
  string timezone = 7;
  string updated_at = 8;
}

message CreateNotificationRequest {
  string user_id = 1;
  string type = 2;
  string title = 3;
  string message = 4;
  string reference_id = 5;
}

message CreateNotificationResponse {
  Notification notification = 1;
}

message GetUnreadCountRequest {
  string user_id = 1;
}

message GetUnreadCountResponse {
  int32 count = 1;
}

message MarkReadRequest {
  string notification_id = 1;
  string user_id = 2;
}

message MarkReadResponse {
  bool success = 1;
}

message SubscribePushRequest {
  string user_id = 1;
  string endpoint = 2;
  string p256dh = 3;
  string auth = 4;
}

message SubscribePushResponse {
  bool success = 1;
}

message GetSettingsRequest {
  Empty empty = 1;
}

message GetSettingsResponse {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsRequest {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

message GetPreferencesRequest {
  string user_id = 1;
}

message GetPreferencesResponse {
  UserNotificationPreferences preferences = 1;
}

message UpdatePreferencesRequest {
  string user_id = 1;
  map<string, ChannelPreferences> preferences = 2;
  EmailDigest email_digest = 3;
  string quiet_hours_start = 4;
  string quiet_hours_end = 5;
  string timezone = 6;
}

message UpdatePreferencesResponse {
  UserNotificationPreferences preferences = 1;
}

service NotificationService {
  rpc Dispatch(NotificationEvent) returns (DispatchResponse);
  rpc DispatchBatch(DispatchBatchRequest) returns (stream DispatchResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc SubscribePush(SubscribePushRequest) returns (SubscribePushResponse);
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse);
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
}
