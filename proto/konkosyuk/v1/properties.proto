syntax = "proto3";

package konkosyuk.v1;

import "konkosyuk/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.konkosyuk.api.v1";

option go_package = "notif/proto/konkosyuk/v1";

enum PropertyType {
  PROPERTY_TYPE_UNSPECIFIED = 0;
  KOST = 1;
  KONTRAKAN = 2;
  APARTEMEN = 3;
  RUMAH = 4;
  RUKO = 5;
}

enum PropertyStatus {
  PROPERTY_STATUS_UNSPECIFIED = 0;
  AKTIF = 1;
  NONAKTIF = 2;
}

enum UnitStatus {
  UNIT_STATUS_UNSPECIFIED = 0;
  AVAILABLE = 1;
  BOOKED = 2;
  MAINTENANCE = 3;
}

enum DurationUnit {
  DURATION_UNIT_UNSPECIFIED = 0;
  HOURS = 1;
  DAYS = 2;
  MONTHS = 3;
  YEARS = 4;
}

message PackageItem {
  string id = 1;
  string label = 2;
  DurationUnit unit = 3;
  int32 value = 4;
  double base_price = 5;
  double discount_percent = 6;
  double ppn_percent = 7;
  double app_fee_percent = 8;
  double final_price = 9;
  bool is_available = 10;
}

message CustomPackage {
  bool enabled = 1;
  string label = 2;
  DurationUnit unit = 3;
  double price_per_unit = 4;
  int32 min_duration = 5;
  int32 max_duration = 6;
}

message PropertyPackages {
  repeated PackageItem predefined = 1;
  CustomPackage custom = 2;
}

message Property {
  string id = 1;
  string owner_id = 2;
  string name = 3;
  string description = 4;
  string address = 5;
  string province = 6;
  string city = 7;
  string district = 8;
  PropertyType type = 9;
  string base_price = 10;
  PropertyPackages packages = 11;
  PropertyStatus status = 12;
  repeated string amenities = 13;
  map<string, string> metadata = 14;
  repeated string images = 15;
  double latitude = 16;
  double longitude = 17;
  bool is_active = 18;
  bool is_featured = 19;
  bool gps_verified = 20;
  string featured_until = 21;
  string ical_export_token = 22;
  string ical_import_url = 23;
  string created_at = 24;
  string updated_at = 25;
}

message Unit {
  string id = 1;
  string property_id = 2;
  string name = 3;
  string description = 4;
  string price = 5;
  string capacity = 6;
  string size = 7;
  UnitStatus status = 8;
  map<string, string> metadata = 9;
  string room_size = 10;
  bool electricity_included = 11;
  bool furniture_included = 12;
  string created_at = 13;
  string updated_at = 14;
}

message ListPropertiesRequest {
  PaginationRequest pagination = 1;
  string owner_id = 2;
  PropertyType type = 3;
  string city = 4;
  string search = 5;
  double lat = 6;
  double lng = 7;
  double radius_km = 8;
  repeated string amenities = 9;
  double min_price = 10;
  double max_price = 11;
  bool is_featured = 12;
  repeated string ids = 13;
  string area = 14;
  string campus = 15;
  string duration = 16;
  string gender = 17;
}

message ListPropertiesResponse {
  repeated Property properties = 1;
  PaginationResponse pagination = 2;
}

message GetPropertyRequest {
  string id = 1;
}

message GetPropertyResponse {
  Property property = 1;
  repeated Unit units = 2;
}

service PropertyService {
  rpc ListProperties (ListPropertiesRequest) returns (ListPropertiesResponse);
  rpc GetProperty (GetPropertyRequest) returns (GetPropertyResponse);
}
