syntax = "proto3";

package konkosyuk.v1;

option java_multiple_files = true;
option java_package = "com.konkosyuk.api.v1";

option go_package = "notif/proto/konkosyuk/v1";

message Empty {}

message PaginationRequest {
  int32 page = 1;
  int32 limit = 2;
}

message PaginationResponse {
  int32 total = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 total_pages = 4;
}

message ApiResponse {
  bool success = 1;
  string message = 2;
}
